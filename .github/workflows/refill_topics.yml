name: Auto Refill 20 Space Topics (1-Click)

on:
  workflow_dispatch:

jobs:
  refill-topics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Safe Topic Refill
        run: |
          python pipeline/refill_topics.py

      - name: Commit and Push Updated Topics Database
        run: |
          git config --global user.name "SciBytes Topic Manager"
          git config --global user.email "bot@scibytes.internal"
          git pull --rebase origin main || true
          git add pipeline/topics_database.json
          git commit -m "Auto-refill: Added 20 fresh space topics to database [skip ci]" || echo "No changes to commit"
          git push origin main

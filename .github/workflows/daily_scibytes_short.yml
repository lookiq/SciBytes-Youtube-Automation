name: Daily SciBytes Short Automation

on:
  schedule:
    # 14:30 UTC = 8:30 PM Bangladesh Time (BST) / 10:30 AM USA Eastern Time (EST)
    # Perfectly timed 1.5 hours before USA lunch & afternoon peak traffic!
    - cron: '30 14 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Short Video & Metadata
        run: |
          python pipeline/build_short.py

      - name: Upload Video to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: 'public'
        run: |
          python pipeline/upload_to_youtube.py

      - name: Commit and Push Updated Topics Database
        run: |
          git config --global user.name "SciBytes Automation Bot"
          git config --global user.email "bot@scibytes.local"
          git add pipeline/topics_database.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update: mark topic as used [skip ci]" && git push)

name: Daily SciBytes Shorts Generator & Uploader

on:
  schedule:
    # Slot 1: USA Morning Peak (7:15 AM EST / 11:15 UTC / 5:15 PM Bangladesh BST)
    - cron: '15 11 * * *'
    # Slot 2: USA Midday / Lunch Peak (11:45 AM EST / 15:45 UTC / 9:45 PM Bangladesh BST)
    - cron: '45 15 * * *'
    # Slot 3: USA Evening Prime Time (5:15 PM EST / 21:15 UTC / 3:15 AM Bangladesh BST)
    - cron: '15 21 * * *'
  workflow_dispatch: # Allows manual 1-click execution anytime from GitHub web UI

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build SciBytes Short (Script, Voice, Footage, Subtitles, FFmpeg)
        run: |
          python pipeline/build_short.py

      - name: Upload Short to YouTube Studio
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: 'public'
        run: |
          python pipeline/upload_to_youtube.py

      - name: Commit Topic State and History
        run: |
          git config --global user.name "SciBytes Automation Bot"
          git config --global user.email "bot@scibytes.internal"
          git add pipeline/topics_database.json upload_history.log || true
          git commit -m "Auto-update: Mark topic used and log upload [skip ci]" || echo "No changes to commit"
          git push

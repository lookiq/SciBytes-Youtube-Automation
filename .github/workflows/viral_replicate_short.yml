name: Viral Reference to SciBytes Short Generator

on:
  workflow_dispatch:
    inputs:
      viral_url:
        description: 'YouTube Short or Video URL to Replicate & Transform'
        required: true
        default: 'https://www.youtube.com/shorts/HmlardFioZk'
      auto_upload:
        description: 'Publish directly to YouTube Studio'
        type: boolean
        required: true
        default: true

jobs:
  viral-transform-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install yt-dlp

      - name: Run Viral Reverse-Engineering & CapCut Video Pipeline
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: 'public'
        run: |
          UPLOAD_FLAG=""
          if [ "${{ inputs.auto_upload }}" = "true" ]; then
            UPLOAD_FLAG="--upload"
          fi
          python pipeline/build_from_viral.py --url "${{ inputs.viral_url }}" $UPLOAD_FLAG
